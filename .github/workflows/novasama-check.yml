name: Novasama Check

on:
  pull_request:
    paths: [".novasama/**", ".github/workflows/novasama-*.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Helm
        run: /usr/bin/python3 .novasama/install_helm.py
      - name: Test the fork tooling
        run: /usr/bin/python3 -m unittest discover -s .novasama/tests
      - name: Build all listed charts without publishing
        run: /usr/bin/python3 .novasama/check.py
