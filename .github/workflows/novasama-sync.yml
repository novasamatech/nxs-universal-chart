name: Novasama Sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check the merge without pushing or publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: novasama-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'novasamatech/nxs-universal-chart' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Disable existing upstream workflows
        run: /usr/bin/python3 .novasama/guard.py
      - name: Preflight and merge upstream main
        run: |
          if [ "$DRY_RUN" = true ]; then
            /usr/bin/python3 .novasama/sync.py --dry-run
          else
            /usr/bin/python3 .novasama/sync.py
          fi
      - name: Disable upstream workflows after sync
        if: always()
        run: /usr/bin/python3 .novasama/guard.py
      - name: Dispatch release explicitly
        if: success() && inputs.dry_run != true
        run: gh workflow run novasama-release.yml --repo "$GITHUB_REPOSITORY" --ref main
