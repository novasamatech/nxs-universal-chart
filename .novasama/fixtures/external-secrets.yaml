nuc-external-secrets:
  enabled: true
  secretStores:
    offline-test:
      spec:
        provider:
          fake:
            data:
              - key: example
                value: offline-render
  externalSecrets:
    offline-test:
      spec:
        secretStoreRef:
          name: offline-test
          kind: SecretStore
        target:
          name: offline-test
        data:
          - secretKey: value
            remoteRef:
              key: example
