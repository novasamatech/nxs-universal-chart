  nxs-universal-chart:
  - annotations:
      artifacthub.io/category: integration-delivery
      artifacthub.io/changes: "- kind: added\n  description: \"HPA resources now render\
        \ Kubernetes spec.behavior (scaleUp/scaleDown stabilization windows and policies)\
        \ when hpas.<name>.behavior is set\"\n- kind: added\n  description: \"CronJobs\
        \ render spec.jobTemplate.metadata from cronJobs.<name>.jobLabels / jobAnnotations\
        \ and cronJobsGeneral defaults\"\n- kind: fixed\n  description: \"Deployments\
        \ and StatefulSets no longer render spec.replicas when replicas is unset,\
        \ so Helm upgrades stop resetting the replica count managed by an autoscaler\
        \ (explicit values, including 0, are preserved)\"\n- kind: changed\n  description:\
        \ \"Deployments and StatefulSets targeted by an enabled hpas entry never render\
        \ spec.replicas, even when replicas is set\"\n"
      artifacthub.io/license: Apache License 2.0
      artifacthub.io/links: "- name: Home\n  url: https://nixys.io\n- name: Source\n\
        \  url: https://github.com/nixys/nxs-universal-chart\n"
      artifacthub.io/prerelease: 'false'
